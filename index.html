<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"/>
<title>SDT Wallet Ultra X</title>
<link
href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
:root{
--bg1:#020617;
--bg2:#0f172a;
--bg3:#111827;
--cyan:#00f5ff;
--green:#00ff99;
--card:
rgba(255,255,255,.05);
--border:
rgba(255,255,255,.08);
}
body{
font-family:'Prompt',sans-serif;
background:
linear-gradient(
135deg,
var(--bg1),
var(--bg2),
var(--bg3)
);
color:white;
min-height:100vh;
overflow-x:hidden;
}
body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:var(--cyan);
filter:blur(180px);
top:-200px;
left:-200px;
opacity:.12;
z-index:-1;
}
body::after{
content:'';
position:fixed;
width:500px;
height:500px;
background:var(--green);
filter:blur(180px);
bottom:-200px;
right:-200px;
opacity:.12;
z-index:-1;
}
.container{
max-width:430px;
margin:auto;
padding:20px 16px 120px;
}
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
}
.logo{
display:flex;
align-items:center;
gap:12px;
}
.logo-icon{
width:58px;
height:58px;
border-radius:18px;
background:
linear-gradient(
45deg,
var(--cyan),
var(--green)
);
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
font-weight:700;
color:black;
box-shadow:
0 0 30px rgba(0,255,255,.35);
}
.wallet-card{
background:var(--card);
border:1px solid var(--border);
backdrop-filter:blur(30px);
border-radius:30px;
padding:24px;
box-shadow:
0 10px 40px rgba(0,0,0,.35);
}
.balance{
font-size:40px;
font-weight:700;
margin-top:10px;
}
.usd{
margin-top:5px;
font-size:14px;
color:var(--green);
}
.connect-btn,
.send-btn{
width:100%;
padding:16px;
border:none;
border-radius:20px;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.25s;
}
.connect-btn{
margin-top:20px;
background:
linear-gradient(
45deg,
var(--cyan),
var(--green)
);
color:black;
}
.send-btn{
margin-top:15px;
background:
linear-gradient(
45deg,
#22c55e,
var(--green)
);
color:black;
}
.connect-btn:hover,
.send-btn:hover{
transform:translateY(-2px);
}
.address{
margin-top:18px;
padding:15px;
border-radius:18px;
background:
rgba(255,255,255,.04);
font-size:13px;
word-break:break-all;
}
.status{
margin-top:12px;
font-size:12px;
color:#94a3b8;
}
.actions{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:12px;
margin-top:20px;
}
.action{
background:
rgba(255,255,255,.04);
padding:16px;
border-radius:18px;
text-align:center;
cursor:pointer;
transition:.25s;
}
.action:hover{
transform:translateY(-3px);
background:
rgba(0,255,255,.08);
}
.action-icon{
font-size:24px;
margin-bottom:8px;
}
.section{
margin-top:28px;
}
.input{
width:100%;
padding:16px;
margin-top:12px;
border:none;
outline:none;
border-radius:18px;
background:
rgba(255,255,255,.05);
color:white;
font-size:15px;
}
.row{
display:flex;
gap:10px;
}
.max-btn{
width:90px;
margin-top:12px;
border:none;
border-radius:18px;
background:#0284c7;
color:white;
font-weight:600;
cursor:pointer;
}
#qrcode{
display:flex;
justify-content:center;
margin-top:20px;
}
#reader{
margin-top:20px;
overflow:hidden;
border-radius:18px;
}
.history{
margin-top:20px;
display:flex;
flex-direction:column;
gap:12px;
}
.tx{
background:
rgba(255,255,255,.04);
padding:14px;
border-radius:16px;
font-size:12px;
}
.txhash{
margin-top:5px;
color:#94a3b8;
word-break:break-all;
font-size:11px;
}
.footer{
text-align:center;
margin-top:40px;
font-size:12px;
color:#64748b;
}
.loading{
opacity:.7;
pointer-events:none;
}
</style>
</head>
<body>
<div class="container">
<div class="topbar">
<div class="logo">
<div class="logo-icon">
S
</div>
<div>
<h2>SDT Wallet</h2>
<div style="font-size:12px;color:#94a3b8;">
Ultra X GitHub Edition
</div>
</div>
</div>
<div style="font-size:24px;">
💎
</div>
</div>
<div class="wallet-card">
<div style="color:#94a3b8;">
Portfolio Balance
</div>
<div class="balance" id="balance">
0.00000000
</div>
<div class="usd">
Bitkub Chain
</div>
<button
class="connect-btn"
id="connectBtn"
onclick="connectWallet()">
Connect Wallet
</button>
<div
class="status"
id="status">
Disconnected
</div>
<div
class="address"
id="walletAddress">
Wallet Address
</div>
<div class="actions">
<div class="action"
onclick="copyAddress()">
<div class="action-icon">
📋
</div>
Copy
</div>
<div class="action"
onclick="generateQR()">
<div class="action-icon">
🔳
</div>
QR
</div>
<div class="action"
onclick="scanQR()">
<div class="action-icon">
📷
</div>
Scan
</div>
<div class="action"
onclick="addToken()">
<div class="action-icon">
➕
</div>
Add
</div>
</div>
<div id="qrcode"></div>
<div id="reader"></div>
</div>
<div class="section">
<h2>Send SDT</h2>
<input
type="text"
class="input"
id="toAddress"
placeholder="Recipient Address"
/>
<div class="row">
<input
type="number"
class="input"
id="amount"
placeholder="Amount"
/>
<button
class="max-btn"
onclick="setMax()">
MAX
</button>
</div>
<button
class="send-btn"
id="sendBtn"
onclick="sendToken()">
Send SDT
</button>
</div>
<div class="section">
<h2>Recent Transactions</h2>
<div
class="history"
id="history">
<div class="tx">
No Transactions
</div>
</div>
</div>
<div class="footer">
Powered by SDT Ecosystem
</div>
</div>
<script>
const SDT_TOKEN_ADDRESS =
"PASTE_REAL_SDT_TOKEN_ADDRESS";
const SDT_DECIMALS = 8;
const tokenABI = [
"function balanceOf(address owner) view returns (uint256)",
"function transfer(address to,uint amount) returns (bool)",
"function symbol() view returns (string)"
];
let provider;
let signer;
let contract;
let userAddress;
let html5QrCode;
let currentBalance = 0;
function toast(icon,title){
Swal.fire({
toast:true,
position:'top',
icon,
title,
showConfirmButton:false,
timer:1600
});
}
function shorten(addr){
return addr.slice(0,6)
+ "..."
+ addr.slice(-4);
}
function parseError(err){
if(err?.data?.message){
return err.data.message;
}
if(err?.message){
return err.message;
}
return "Unknown Error";
}
function setLoading(state){
const btn =
document.getElementById(
"connectBtn"
);
if(state){
btn.classList.add(
"loading"
);
btn.innerHTML =
"Connecting...";
}else{
btn.classList.remove(
"loading"
);
btn.innerHTML =
"Connected";
}
}
async function addBitkubChain(){
await ethereum.request({
method:'wallet_addEthereumChain',
params:[{
chainId:'0x60',
chainName:'Bitkub Chain',
nativeCurrency:{
name:'KUB',
symbol:'KUB',
decimals:18
},
rpcUrls:[
'https://rpc.bitkubchain.io'
],
blockExplorerUrls:[
'https://www.bkcscan.com'
]
}]
});
}
async function connectWallet(){
try{
if(!window.ethereum){
Swal.fire({
icon:'error',
title:'Please install MetaMask'
});
return;
}
setLoading(true);
await ethereum.request({
method:'eth_requestAccounts'
});
const chainId =
await ethereum.request({
method:'eth_chainId'
});
if(chainId !== '0x60'){
await addBitkubChain();
}
provider =
new ethers.providers.Web3Provider(
window.ethereum
);
signer =
provider.getSigner();
userAddress =
await signer.getAddress();
contract =
new ethers.Contract(
SDT_TOKEN_ADDRESS,
tokenABI,
provider
);
document.getElementById(
"walletAddress"
).innerHTML =
shorten(userAddress);
document.getElementById(
"status"
).innerHTML =
"Connected";
localStorage.setItem(
"sdt_connected",
"1"
);
await loadBalance();
toast(
'success',
'Wallet Connected'
);
}catch(err){
console.log(err);
Swal.fire({
icon:'error',
title:parseError(err)
});
}
setLoading(false);
}
async function loadBalance(){
try{
const balance =
await contract.balanceOf(
userAddress
);
const formatted =
ethers.utils.formatUnits(
balance,
SDT_DECIMALS
);
currentBalance =
formatted;
document.getElementById(
"balance"
).innerHTML =
parseFloat(formatted)
.toFixed(8)
+ " SDT";
}catch(err){
console.log(err);
}
}
function setMax(){
document.getElementById(
"amount"
).value =
parseFloat(currentBalance)
.toFixed(8);
}
function copyAddress(){
navigator.clipboard.writeText(
userAddress
);
toast(
'success',
'Address Copied'
);
}
function generateQR(){
document.getElementById(
"qrcode"
).innerHTML='';
new QRCode(
document.getElementById(
"qrcode"
),
{
text:userAddress,
width:220,
height:220
}
);
}
async function scanQR(){
try{
if(html5QrCode){
await html5QrCode.stop();
}
html5QrCode =
new Html5Qrcode(
"reader"
);
html5QrCode.start(
{facingMode:"environment"},
{
fps:10,
qrbox:250
},
(decodedText)=>{
document.getElementById(
"toAddress"
).value =
decodedText;
html5QrCode.stop();
toast(
'success',
'QR Scanned'
);
}
);
}catch(err){
console.log(err);
}
}
async function sendToken(){
try{
const btn =
document.getElementById(
"sendBtn"
);
btn.disabled = true;
btn.innerHTML =
"Sending...";
const to =
document.getElementById(
"toAddress"
).value.trim();
const amount =
document.getElementById(
"amount"
).value;
if(
!ethers.utils.isAddress(to)
){
Swal.fire({
icon:'error',
title:'Invalid Address'
});
resetSend();
return;
}
if(
!amount ||
Number(amount)<=0
){
Swal.fire({
icon:'error',
title:'Invalid Amount'
});
resetSend();
return;
}
const tokenWithSigner =
contract.connect(signer);
const parsedAmount =
ethers.utils.parseUnits(
amount,
SDT_DECIMALS
);
const tx =
await tokenWithSigner.transfer(
to,
parsedAmount
);
saveTx(
tx.hash,
amount,
to
);
await tx.wait();
Swal.fire({
icon:'success',
title:'Transfer Success',
html:`
<a
href="https://www.bkcscan.com/tx/${tx.hash}"
target="_blank"
style="color:#00ffcc;">
View Transaction
</a>
`
});
await loadBalance();
}catch(err){
console.log(err);
Swal.fire({
icon:'error',
title:parseError(err)
});
}
resetSend();
}
function resetSend(){
document.getElementById(
"sendBtn"
).disabled=false;
document.getElementById(
"sendBtn"
).innerHTML=
"Send SDT";
}
function saveTx(hash,amount,to){
let txs =
JSON.parse(
localStorage.getItem(
"sdt_txs"
)||"[]"
);
txs.unshift({
hash,
amount,
to,
time:Date.now()
});
txs = txs.slice(0,10);
localStorage.setItem(
"sdt_txs",
JSON.stringify(txs)
);
renderHistory();
}
function renderHistory(){
const history =
document.getElementById(
"history"
);
const txs =
JSON.parse(
localStorage.getItem(
"sdt_txs"
)||"[]"
);
if(!txs.length){
history.innerHTML =
'<div class="tx">No Transactions</div>';
return;
}
history.innerHTML='';
txs.forEach(tx=>{
history.innerHTML += `
<div class="tx">
<div>
Sent ${tx.amount} SDT
</div>
<div style="margin-top:5px;">
To: ${shorten(tx.to)}
</div>
<div class="txhash">
${tx.hash}
</div>
</div>
`;
});
}
async function addToken(){
try{
await ethereum.request({
method:'wallet_watchAsset',
params:{
type:'ERC20',
options:{
address:
SDT_TOKEN_ADDRESS,
symbol:'SDT',
decimals:8,
image:''
}
}
});
toast(
'success',
'Token Added'
);
}catch(err){
console.log(err);
}
}
if(window.ethereum){
ethereum.on(
'accountsChanged',
()=>location.reload()
);
ethereum.on(
'chainChanged',
()=>location.reload()
);
}
window.addEventListener(
'load',
()=>{
renderHistory();
if(
localStorage.getItem(
"sdt_connected"
)==="1"
){
connectWallet();
}
}
);
setInterval(()=>{
if(userAddress){
loadBalance();
}
},15000);
</s

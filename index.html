<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0">
<title>SDT Wallet Ultra</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
padding:20px;
min-height:100vh;
}
.container{
max-width:430px;
margin:auto;
}
.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-top:20px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}
.title{
font-size:30px;
font-weight:bold;
margin-bottom:20px;
}
.balance{
font-size:34px;
font-weight:bold;
margin-top:10px;
}
.status{
margin-top:10px;
font-size:14px;
color:#94a3b8;
}
.address{
margin-top:15px;
padding:12px;
background:#0f172a;
border-radius:12px;
word-break:break-all;
font-size:13px;
}
button{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}
button:active{
transform:scale(.98);
}
.connect{
background:#00ffaa;
color:black;
}
.disconnect{
background:#ef4444;
color:white;
}
.send{
background:#22c55e;
color:black;
}
.copy{
background:#38bdf8;
color:black;
}
input{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:14px;
background:#0f172a;
color:white;
font-size:15px;
outline:none;
}
.history{
margin-top:20px;
display:flex;
flex-direction:column;
gap:12px;
}
.tx{
background:#0f172a;
padding:14px;
border-radius:14px;
font-size:13px;
}
.loading{
opacity:.6;
pointer-events:none;
}
</style>
</head>
<body>
<div class="container">
<div class="title">
SDT Wallet Ultra
</div>
<div class="card">
<div>
Portfolio Balance
</div>
<div
class="balance"
id="balance">
0.00000000 SDT
</div>
<div
class="status"
id="status">
Disconnected
</div>
<div
class="address"
id="walletAddress">
Wallet Address
</div>
<button
class="connect"
id="connectBtn"
onclick="connectWallet()">
Connect MetaMask
</button>
<button
class="disconnect"
onclick="disconnectWallet()">
Disconnect
</button>
<button
class="copy"
onclick="copyAddress()">
Copy Address
</button>
</div>
<div class="card">
<h2>Send SDT</h2>
<input
id="toAddress"
placeholder="Recipient Address">
<input
id="amount"
type="number"
placeholder="Amount">
<button
class="send"
id="sendBtn"
onclick="sendToken()">
Send SDT
</button>
</div>
<div class="card">
<h2>Recent Transactions</h2>
<div
class="history"
id="history">
<div class="tx">
No Transactions
</div>
</div>
</div>
</div>
<script>
const SDT_TOKEN_ADDRESS =
"0x046c2b024e3BcAeCC965BB0f80cF8e066352fA01";
const SDT_DECIMALS = 8;
const tokenABI = [
"function balanceOf(address owner) view returns (uint256)",
"function transfer(address to,uint256 amount) returns (bool)"
];
let provider;
let signer;
let contract;
let userAddress;
let currentBalance = "0";
async function switchBitkub(){
try{
await ethereum.request({
method:'wallet_switchEthereumChain',
params:[{
chainId:'0x60'
}]
});
}catch(err){
if(err.code === 4902){
await ethereum.request({
method:'wallet_addEthereumChain',
params:[{
chainId:'0x60',
chainName:'Bitkub Chain',
nativeCurrency:{
name:'KUB',
symbol:'KUB',
decimals:18
},
rpcUrls:[
'https://rpc.bitkubchain.io'
],
blockExplorerUrls:[
'https://www.bkcscan.com'
]
}]
});
}
}
}
async function connectWallet(){
try{
if(!window.ethereum){
alert(
"กรุณาเปิดผ่าน MetaMask Browser"
);
return;
}
const btn =
document.getElementById(
"connectBtn"
);
btn.classList.add(
"loading"
);
btn.innerHTML =
"Connecting...";
await switchBitkub();
await ethereum.request({
method:'eth_requestAccounts'
});
provider =
new ethers.providers.Web3Provider(
window.ethereum
);
signer =
provider.getSigner();
userAddress =
await signer.getAddress();
contract =
new ethers.Contract(
SDT_TOKEN_ADDRESS,
tokenABI,
signer
);
document.getElementById(
"walletAddress"
).innerHTML =
userAddress;
document.getElementById(
"status"
).innerHTML =
"Connected";
localStorage.setItem(
"sdt_connected",
"1"
);
await loadBalance();
renderHistory();
btn.classList.remove(
"loading"
);
btn.innerHTML =
"Connected";
}catch(err){
console.log(err);
alert(err.message);
}
}
async function loadBalance(){
try{
const balance =
await contract.balanceOf(
userAddress
);
const formatted =
ethers.utils.formatUnits(
balance,
SDT_DECIMALS
);
currentBalance = formatted;
document.getElementById(
"balance"
).innerHTML =
parseFloat(formatted)
.toFixed(8)
+ " SDT";
}catch(err){
console.log(err);
}
}
async function sendToken(){
try{
const btn =
document.getElementById(
"sendBtn"
);
btn.disabled = true;
btn.innerHTML =
"Sending...";
const to =
document.getElementById(
"toAddress"
).value.trim();
const amount =
document.getElementById(
"amount"
).value;
if(!ethers.utils.isAddress(to)){
alert(
"Invalid Address"
);
resetSend();
return;
}
if(Number(amount)<=0){
alert(
"Invalid Amount"
);
resetSend();
return;
}
const parsedAmount =
ethers.utils.parseUnits(
amount,
SDT_DECIMALS
);
const tx =
await contract.transfer(
to,
parsedAmount
);
saveTx(
tx.hash,
amount,
to
);
alert(
"Transaction Sent:\n" +
tx.hash
);
await tx.wait();
await loadBalance();
resetSend();
}catch(err){
console.log(err);
alert(err.message);
resetSend();
}
}
function resetSend(){
const btn =
document.getElementById(
"sendBtn"
);
btn.disabled = false;
btn.innerHTML =
"Send SDT";
}
function disconnectWallet(){
localStorage.removeItem(
"sdt_connected"
);
location.reload();
}
function copyAddress(){
if(!userAddress){
alert(
"Wallet Not Connected"
);
return;
}
navigator.clipboard.writeText(
userAddress
);
alert(
"Address Copied"
);
}
function saveTx(hash,amount,to){
let txs =
JSON.parse(
localStorage.getItem(
"sdt_txs"
)||"[]"
);
txs.unshift({
hash,
amount,
to
});
txs = txs.slice(0,10);
localStorage.setItem(
"sdt_txs",
JSON.stringify(txs)
);
renderHistory();
}
function shorten(addr){
return addr.slice(0,6)
+ "..."
+ addr.slice(-4);
}
function renderHistory(){
const history =
document.getElementById(
"history"
);
const txs =
JSON.parse(
localStorage.getItem(
"sdt_txs"
)||"[]"
);
if(!txs.length){
history.innerHTML =
'<div class="tx">No Transactions</div>';
return;
}
history.innerHTML='';
txs.forEach(tx=>{
history.innerHTML += `
<div class="tx">
<div>
Sent ${tx.amount} SDT
</div>
<div style="margin-top:6px;">
To: ${shorten(tx.to)}
</div>
<div style="margin-top:6px;font-size:11px;color:#94a3b8;word-break:break-all;">
${tx.hash}
</div>
</div>
`;
});
}
if(window.ethereum){
ethereum.on(
'accountsChanged',
()=>location.reload()
);
ethereum.on(
'chainChanged',
()=>location.reload()
);
}
window.addEventListener(
'load',
()=>{
renderHistory();
if(
localStorage.getItem(
"sdt_connected"
)==="1"
){
connectWallet();
}
}
);
setInterval(()=>{
if(userAddress){
loadBalance();
}
},15000);
</scr

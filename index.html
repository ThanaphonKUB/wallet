<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SDT Wallet</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://unpkg.com/web3modal"></script>
<script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#16213e,#0f172a 60%);
  color:white;
  min-height:100vh;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
}
.wallet-card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  padding:24px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  margin-bottom:20px;
}
h1{
  font-size:32px;
  margin-bottom:10px;
}
.sub{
  color:#94a3b8;
}
.balance{
  font-size:42px;
  font-weight:bold;
  margin-top:20px;
}
.price{
  color:#10b981;
  margin-top:10px;
}
.address{
  margin-top:15px;
  background:rgba(255,255,255,0.05);
  padding:10px;
  border-radius:12px;
  word-break:break-all;
}
button{
  border:none;
  padding:12px 18px;
  border-radius:14px;
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
}
.btn-primary{
  background:#2563eb;
  color:white;
}
.btn-danger{
  background:#dc2626;
  color:white;
}
.btn-secondary{
  background:#1e293b;
  color:white;
}
button:hover{
  transform:translateY(-2px);
}
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#111827;
  color:white;
  margin-top:10px;
}
.section{
  margin-top:25px;
}
.section-title{
  margin-bottom:15px;
  font-size:20px;
}
.tx-list{
  margin-top:15px;
}
.tx{
  background:rgba(255,255,255,0.05);
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  z-index:999;
  justify-content:center;
  align-items:center;
}
.modal-content{
  background:#111827;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  text-align:center;
}
.close{
  float:right;
  cursor:pointer;
  font-size:22px;
}
iframe{
  width:100%;
  height:400px;
  border:none;
  border-radius:20px;
}
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  padding:15px 20px;
  border-radius:14px;
  display:none;
  z-index:9999;
}
.loading{
  opacity:0.6;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="container">
<div class="wallet-card">
<h1>💎 SDT Wallet</h1>
<div class="sub">Bitkub Chain Wallet</div>
<div class="balance" id="balance">0.00000000 SDT</div>
<div class="price" id="price">$0.00</div>
<div class="address" id="wallet-info">
Not connected
</div>
<div class="row">
<button class="btn-primary" onclick="connectWallet()">
Connect Wallet
</button>
<button class="btn-secondary" onclick="copyAddress()">
Copy Address
</button>
<button class="btn-danger" onclick="logout()">
Logout
</button>
</div>
</div>
<div class="wallet-card">
<div class="section">
<div class="section-title">
📤 Send SDT
</div>
<input id="to" placeholder="Recipient Address"/>
<input id="amount" type="number" placeholder="Amount"/>
<div class="row">
<button class="btn-primary" id="sendBtn" onclick="sendToken()">
Send
</button>
<button class="btn-secondary" onclick="openScanner()">
Scan QR
</button>
<button class="btn-secondary" onclick="openQRModal()">
Receive QR
</button>
</div>
<pre id="receipt" style="margin-top:15px;"></pre>
</div>
</div>
<div class="wallet-card">
<div class="section-title">
📜 Transaction History
</div>
<div id="history" class="tx-list"></div>
</div>
<div class="wallet-card">
<div class="section-title">
📈 SDT Chart
</div>
<iframe
src="https://www.geckoterminal.com/bitkub_chain/pools/0xf42d65b190bb78fb8ead8a92110b653722f96048?embed=1">
</iframe>
</div>
</div>
<div class="modal" id="qrModal">
<div class="modal-content">
<div class="close" onclick="closeQRModal()">
✖
</div>
<h3>Receive SDT</h3>
<div id="qr"></div>
</div>
</div>
<div class="modal" id="scannerModal">
<div class="modal-content">
<div class="close" onclick="closeScanner()">
✖
</div>
<h3>Scan QR</h3>
<div id="scanner"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const tokenAddress =
"0x046c2b024e3BcAeCC965BB0f80cF8e066352fA01";
const tokenDecimals = 18;
const chainId = 96;
let provider;
let signer;
let userAddress;
let scanner;
const web3Modal =
new window.Web3Modal.default({
  cacheProvider:true
});
function toast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>{
    t.style.display="none";
  },3000);
}
function shortAddr(addr){
  if(!addr) return "";
  return addr.slice(0,6)+"..."+addr.slice(-4);
}
async function connectWallet(){
  try{
    const instance =
      await web3Modal.connect();
    provider =
      new ethers.providers.Web3Provider(instance);
    const network =
      await provider.getNetwork();
    if(network.chainId !== chainId){
      toast("Switch to Bitkub Chain");
      return;
    }
    signer = provider.getSigner();
    userAddress =
      await signer.getAddress();
    document.getElementById("wallet-info")
      .innerHTML = `
      Connected:<br>
      ${shortAddr(userAddress)}
      `;
    getBalance();
    toast("Wallet Connected");
  }catch(err){
    toast(err.message);
  }
}
async function getBalance(){
  if(!userAddress) return;
  const contract =
    new ethers.Contract(
      tokenAddress,
      [
        "function balanceOf(address owner) view returns(uint256)"
      ],
      provider
    );
  const raw =
    await contract.balanceOf(userAddress);
  const formatted =
    ethers.utils.formatUnits(raw,tokenDecimals);
  document.getElementById("balance")
    .innerText =
    parseFloat(formatted).toFixed(4)+" SDT";
}
async function sendToken(){
  try{
    const btn =
      document.getElementById("sendBtn");
    btn.classList.add("loading");
    const to =
      document.getElementById("to").value;
    const amount =
      document.getElementById("amount").value;
    if(!ethers.utils.isAddress(to))
      return toast("Invalid Address");
    if(amount <= 0)
      return toast("Invalid Amount");
    const contract =
      new ethers.Contract(
        tokenAddress,
        [
          "function transfer(address to,uint amount) returns(bool)"
        ],
        signer
      );
    const tx =
      await contract.transfer(
        to,
        ethers.utils.parseUnits(
          amount,
          tokenDecimals
        )
      );
    toast("Transaction Sent");
    const receipt =
      await tx.wait();
    saveHistory(
      to,
      amount,
      receipt.transactionHash
    );
    document.getElementById("receipt")
      .innerText =
      receipt.transactionHash;
    getBalance();
    toast("Transfer Complete");
  }catch(err){
    toast(err.message);
  }finally{
    document.getElementById("sendBtn")
      .classList.remove("loading");
  }
}
function saveHistory(to,amount,tx){
  const data =
    JSON.parse(
      localStorage.getItem("sdt_history") || "[]"
    );
  data.unshift({
    to,
    amount,
    tx,
    time:new Date().toLocaleString()
  });
  localStorage.setItem(
    "sdt_history",
    JSON.stringify(data)
  );
  loadHistory();
}
function loadHistory(){
  const wrap =
    document.getElementById("history");
  wrap.innerHTML="";
  const data =
    JSON.parse(
      localStorage.getItem("sdt_history") || "[]"
    );
  data.forEach(item=>{
    const div =
      document.createElement("div");
    div.className="tx";
    div.innerHTML=`
      <div><b>To:</b> ${shortAddr(item.to)}</div>
      <div><b>Amount:</b> ${item.amount} SDT</div>
      <div><b>Time:</b> ${item.time}</div>
      <a
        href="https://www.kubscan.com/tx/${item.tx}"
        target="_blank"
        style="color:#60a5fa;"
      >
      View Transaction
      </a>
    `;
    wrap.appendChild(div);
  });
}
function copyAddress(){
  if(!userAddress)
    return toast("Connect Wallet First");
  navigator.clipboard.writeText(userAddress);
  toast("Address Copied");
}
function openQRModal(){
  if(!userAddress)
    return toast("Connect Wallet");
  document.getElementById("qrModal")
    .style.display="flex";
  document.getElementById("qr")
    .innerHTML="";
  const qr =
    new QRCodeStyling({
      width:220,
      height:220,
      data:`sdt:${userAddress}`,
      dotsOptions:{
        color:"#2563eb",
        type:"rounded"
      },
      backgroundOptions:{
        color:"#ffffff"
      }
    });
  qr.append(
    document.getElementById("qr")
  );
}
function closeQRModal(){
  document.getElementById("qrModal")
    .style.display="none";
}
function openScanner(){
  document.getElementById("scannerModal")
    .style.display="flex";
  scanner =
    new Html5Qrcode("scanner");
  scanner.start(
    {facingMode:"environment"},
    {
      fps:10,
      qrbox:250
    },
    msg=>{
      const addr =
        msg.replace("sdt:","");
      document.getElementById("to")
        .value=addr;
      closeScanner();
      toast("QR Scanned");
    }
  );
}
async function closeScanner(){
  if(scanner){
    await scanner.stop();
    await scanner.clear();
    scanner=null;
  }
  document.getElementById("scannerModal")
    .style.display="none";
}
function logout(){
  web3Modal.clearCachedProvider();
  location.reload();
}
async function fetchPrice(){
  try{
    const res =
      await fetch(
        "https://api.geckoterminal.com/api/v2/networks/bitkub_chain/pools/0xf42d65b190bb78fb8ead8a92110b653722f96048"
      );
    const data =
      await res.json();
    const price =
      parseFloat(
        data.data.attributes.base_token_price_usd
      ).toFixed(6);
    document.getElementById("price")
      .innerText =
      "$"+price+" USD";
  }catch(err){
    document.getElementById("price")
      .innerText =
      "Price unavailable";
  }
}
window.addEventListener("load",async()=>{
  fetchPrice();
  loadHistory();
  if(web3Modal.cachedProvider){
    connectWallet();
  }
});
</scrip>
  </body>
  </html>
